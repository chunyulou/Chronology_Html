<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正覺大事記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PMingLiU', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ebe8 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            color: white;
            padding: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            overflow-x: auto;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            padding: 0 20px;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            height: 6px;
        }

        .tabs::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .tabs::-webkit-scrollbar-thumb {
            background: #8B4513;
            border-radius: 3px;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: none;
            color: #6c757d;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            color: #8B4513;
            background: rgba(139, 69, 19, 0.05);
        }

        .tab.active {
            color: #8B4513;
            border-bottom-color: #8B4513;
            background: rgba(139, 69, 19, 0.08);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .content::-webkit-scrollbar-thumb {
            background: #8B4513;
            border-radius: 4px;
        }

        .category-description {
            background: #fff8dc;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #654321;
            font-size: 14px;
            border-left: 4px solid #8B4513;
        }

        .hint-text {
            background: #e7f3ff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #0066cc;
            font-size: 13px;
            border-left: 4px solid #0066cc;
        }

        .table-container {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
            -webkit-overflow-scrolling: touch;
            overflow: visible;
        }

        #eventsTableContainer {
            overflow: auto;
            max-height: calc(100vh - 260px);
        }

        #catalogTableContainer {
            overflow: auto;
            max-height: calc(100vh - 260px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            table-layout: fixed;
        }

        thead {
            background: #8B4513;
            color: white;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th:first-child {
            padding: 15px 8px;
            width: 50px;
        }

        th:nth-child(2) {
            width: 110px;
            min-width: 110px;
            padding: 15px 5px;
        }

        th:hover {
            background: #654321;
        }

        .event-header {
            position: relative;
        }

        #eventHeaderText {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-icon {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .search-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .search-input-container {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #654321;
            z-index: 20;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        .search-input-container.show {
            display: flex;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .close-search-btn {
            width: 32px;
            height: 32px;
            background: #8B4513;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-search-btn:hover {
            background: #654321;
        }

        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        td {
            padding: 15px;
            font-size: 14px;
            color: #495057;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        td:first-child {
            color: #8B4513;
            font-weight: 600;
            padding: 15px 8px;
        }

        td:nth-child(2) {
            color: #6c757d;
            padding: 15px 5px;
        }

        td:nth-child(3) {
            width: auto;
        }

        .note-icon {
            cursor: pointer;
            margin-left: 8px;
            font-size: 16px;
            transition: all 0.3s;
            display: inline-block;
        }

        .note-icon:hover {
            transform: scale(1.2);
        }

        .sort-indicator {
            font-size: 12px;
            margin-left: 5px;
        }

        .highlight {
            background-color: #ffff00;
            padding: 2px 0;
            font-weight: 600;
        }

        .modern-link {
            color: #0d6efd;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid rgba(13, 110, 253, 0.2);
            padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
        }

        .modern-link:hover {
            color: #0a58ca;
            border-bottom-color: rgba(13, 110, 253, 0.4);
        }

        .hidden {
            display: none !important;
        }

        .sub-tabs {
            display: flex;
            gap: 10px;
            margin: 0 0 12px 0;
            flex-wrap: wrap;
        }

        .sub-tab {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #d0d5d9;
            background: #f4f5f7;
            color: #495057;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .sub-tab.active {
            background: #8B4513;
            color: #fff;
            border-color: #8B4513;
        }

        .publication-tab {
            color: #c4721f;
        }

        .publication-tab.active {
            color: #a45a12;
        }

        .catalog-table th {
            background: #73401a;
        }

        .catalog-title-cell {
            position: relative;
            overflow: visible;
        }

        .catalog-title-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #catalogSearchContainer {
            background: #73401a;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            padding: 0 12px;
            z-index: 30;
        }
        .catalog-title-cell .search-input-container {
            position: absolute;
            left: 0;
            width: calc(100% + 260px);
            top: 0;
            bottom: 0;
        }

        .catalog-table th:nth-child(4),
        .catalog-table td:nth-child(4) {
            width: 110px;
            min-width: 110px;
            white-space: nowrap;
        }

        /* Modal 樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-dialog {
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 600;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-info {
            margin-bottom: 20px;
        }

        .modal-info label {
            display: block;
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .modal-info p {
            color: #6c757d;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .modal-body::-webkit-scrollbar {
            width: 8px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: #8B4513;
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #654321;
        }

        /* 響應式設計 */
        /* 平板（768px - 1024px）*/
        @media (max-width: 1024px) {
            .container {
                margin: 15px;
                height: calc(100vh - 30px);
                border-radius: 8px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 20px;
            }

            .category-description {
                font-size: 13px;
                padding: 12px 15px;
            }

            .hint-text {
                font-size: 12px;
                padding: 10px 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 12px 8px;
            }

            th:first-child {
                width: 45px;
                padding: 12px 6px;
            }

            th:nth-child(2) {
                width: 100px;
                min-width: 100px;
            }

            .sub-tabs {
                gap: 8px;
            }

            .sub-tab {
                padding: 9px 14px;
                font-size: 14px;
            }
        }

        /* 手機橫屏（576px - 768px）*/
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                height: calc(100vh - 20px);
                border-radius: 8px;
            }

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 24px;
                margin-bottom: 5px;
            }

            .header p {
                font-size: 12px;
            }

            .tabs {
                padding: 0 10px;
            }

            .tab {
                padding: 12px 18px;
                font-size: 14px;
            }

            .content {
                padding: 15px;
            }

            .category-description {
                font-size: 12px;
                padding: 10px 12px;
                margin-bottom: 15px;
            }

            .hint-text {
                font-size: 11px;
                padding: 8px 12px;
                margin-bottom: 15px;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                font-size: 13px;
            }

            th {
                padding: 10px 6px;
                font-size: 14px;
            }

            td {
                padding: 10px 6px;
                font-size: 13px;
            }

            th:first-child {
                width: 40px;
                padding: 10px 5px;
            }

            th:nth-child(2) {
                width: 95px;
                min-width: 95px;
            }

            td:nth-child(2) {
                font-size: 12px;
            }

            .note-icon {
                font-size: 14px;
                margin-left: 5px;
            }

            .sub-tab {
                padding: 8px 12px;
                font-size: 13px;
            }

            .modal-dialog {
                width: 95%;
                max-width: none;
            }

            .modal-header {
                padding: 18px;
            }

            .modal-header h2 {
                font-size: 18px;
            }

            .modal-body {
                padding: 18px;
            }

            .modal-info label {
                font-size: 13px;
            }

            .modal-info p {
                font-size: 14px;
                word-wrap: break-word;
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .close-btn {
                width: 32px;
                height: 32px;
                font-size: 20px;
            }
        }

        /* 手機豎屏（小於 576px）*/
        @media (max-width: 576px) {
            .container {
                margin: 5px;
                height: calc(100vh - 10px);
                border-radius: 6px;
            }

            .header {
                padding: 15px 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 11px;
            }

            .tabs {
                padding: 0 5px;
            }

            .tab {
                padding: 10px 15px;
                font-size: 13px;
            }

            .content {
                padding: 12px;
            }

            .category-description {
                font-size: 11px;
                padding: 8px 10px;
                margin-bottom: 12px;
            }

            .hint-text {
                font-size: 10px;
                padding: 6px 10px;
                margin-bottom: 12px;
            }

            .table-container {
                border-radius: 6px;
                position: relative;
            }

            /* 表格可橫向滾動 */
            .table-container::after {
                content: '← 左右滑動查看 →';
                position: absolute;
                bottom: 10px;
                right: 10px;
                background: rgba(139, 69, 19, 0.9);
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 10px;
                pointer-events: none;
                opacity: 0.8;
            }

            table {
                font-size: 12px;
            }

            th {
                padding: 8px 4px;
                font-size: 13px;
            }

            td {
                padding: 8px 4px;
                font-size: 12px;
            }

            th:first-child {
                width: 35px;
                padding: 8px 3px;
            }

            th:nth-child(2) {
                width: 90px;
                min-width: 90px;
            }

            td:first-child {
                font-size: 11px;
            }

            td:nth-child(2) {
                font-size: 11px;
            }

            .note-icon {
                font-size: 13px;
                margin-left: 3px;
            }

            .search-input {
                font-size: 13px;
                padding: 6px 10px;
            }

            #catalogSearchContainer {
                padding: 0 12px;
            }

            .close-search-btn {
                padding: 0 10px;
            }

            #catalogSearchInput,
            #searchInput {
                flex: 1;
                min-width: 0;
                width: 100%;
            }

            .catalog-title-cell .search-input-container {
                width: calc(100% + 160px);
            }

            .sub-tabs {
                gap: 6px;
            }

            .sub-tab {
                padding: 7px 10px;
                font-size: 12px;
            }

            .modal-dialog {
                width: 98%;
            }

            .modal-content {
                border-radius: 8px;
            }

            .modal-header {
                padding: 15px;
            }

            .modal-header h2 {
                font-size: 16px;
            }

            .modal-body {
                padding: 15px;
            }

            .modal-info {
                margin-bottom: 15px;
            }

            .modal-info label {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .modal-info p {
                font-size: 13px;
                line-height: 1.6;
                word-wrap: break-word;
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .close-btn {
                width: 28px;
                height: 28px;
                font-size: 18px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>正覺教團大事記</h1>
            <p>記錄從1987年至今的重要弘法歷程</p>
        </div>

        <!-- 分類 Tab -->
        <div class="tabs" id="tabs">
            <button class="tab active" onclick="switchTab('總表', this)">總表</button>
            <button class="tab" onclick="switchTab('平實導師', this)">平實導師</button>
            <button class="tab" onclick="switchTab('講經', this)">講經</button>
            <button class="tab" onclick="switchTab('開課與禪修', this)">開課與禪修</button>
            <button class="tab" onclick="switchTab('弘法事務', this)">弘法事務</button>
            <button class="tab" onclick="switchTab('法會', this)">法會</button>
            <button class="tab" onclick="switchTab('祖師堂與正覺寺', this)">祖師堂與正覺寺</button>
            <button class="tab" onclick="switchTab('摧邪顯正', this)">摧邪顯正</button>
            <button class="tab" onclick="switchTab('社會公益', this)">社會公益</button>
            <button class="tab" onclick="switchTab('推廣活動', this)">推廣活動</button>
            <button class="tab publication-tab" onclick="switchTab('出版品', this)">出版品</button>
        </div>

        <!-- 內容區 -->
        <div class="content">
            <!-- 類別說明 -->
            <div class="category-description" id="categoryDescription">
                正覺教團大事記總覽，共 209 筆資料，記錄從1987年至今的重要弘法歷程。
            </div>

            <!-- 提示文字 -->
            <div class="hint-text">
                💡 提示：點擊大事旁的 📝 圖示可查看詳細備註
            </div>

            <div class="sub-tabs hidden" id="publicationSubTabs">
                <button class="sub-tab active" data-view="events" onclick="switchPublicationView('events')">大事</button>
                <button class="sub-tab" data-view="catalog" onclick="switchPublicationView('catalog')">出版品目錄</button>
            </div>

            <!-- 表格 -->
            <div class="table-container" id="eventsTableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>序號</th>
                            <th onclick="toggleSort()">
                                日期 <span class="sort-indicator" id="sortIndicator">▼</span>
                            </th>
                            <th class="event-header" id="eventHeader">
                                <span id="eventHeaderText">
                                    大事
                                    <span class="search-icon" onclick="toggleSearch('events', event)" title="搜尋">🔍 搜尋</span>
                                </span>
                                <div class="search-input-container" id="searchContainer">
                                    <input 
                                        type="text" 
                                        class="search-input" 
                                        id="searchInput" 
                                        placeholder="輸入關鍵字搜尋..."
                                        oninput="handleSearch('events')"
                                    >
                                    <button class="close-search-btn" onclick="toggleSearch('events')" title="關閉搜尋">✕</button>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="eventTable">
                        <!-- 資料將由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>

            <div class="table-container hidden" id="catalogTableContainer">
                <table class="catalog-table">
                    <thead>
                        <tr>
                            <th>序號</th>
                            <th onclick="toggleCatalogSort('category')">分類 <span class="sort-indicator" id="catalogSortCategory">▼</span></th>
                            <th class="catalog-title-cell">
                                <span class="catalog-title-header">
                                    書名
                                    <span class="search-icon" onclick="toggleSearch('catalog', event)" title="搜尋">🔍 搜尋</span>
                                </span>
                                <div class="search-input-container" id="catalogSearchContainer">
                                    <input 
                                        type="text" 
                                        class="search-input" 
                                        id="catalogSearchInput" 
                                        placeholder="輸入關鍵字搜尋出版品..."
                                        oninput="handleSearch('catalog')"
                                    >
                                    <button class="close-search-btn" onclick="toggleSearch('catalog')" title="關閉搜尋">✕</button>
                                </div>
                            </th>
                            <th onclick="toggleCatalogSort('publishDate')">出版日期 <span class="sort-indicator" id="catalogSortPublish">▼</span></th>
                            <th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="catalogTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📝 詳細備註</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="modal-info">
                        <label>日期</label>
                        <p id="modalDate"></p>
                    </div>
                    <div class="modal-info">
                        <label>大事</label>
                        <p id="modalEvent"></p>
                    </div>
                    <div class="modal-info">
                        <label>紀要</label>
                        <p id="modalNote"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 載入資料 -->
    <script src="table_data.js"></script>
    <script src="publications_data.js"></script>

    <!-- 主要 JavaScript -->
    <script>
        // 類別簡介
        const categoryDescriptions = {
            '總表': '正覺教團大事記總覽，共 209 筆資料，記錄從1987年至今的重要弘法歷程。',
            '平實導師': '平實導師相關的重要事蹟與弘法活動，共 119 筆。',
            '講經': '平實導師歷年講經說法的記錄，共 56 筆。',
            '出版品': '正覺教團出版的各類書籍與刊物，共 110 筆。',
            '開課與禪修': '各類課程開設、禪三禪修等教學活動，共 20 筆。',
            '弘法事務': '電視網路弘法、講堂成立、組織管理等事務，共 46 筆。',
            '法會': '浴佛、超薦、布薩等各類法會，共 26 筆。',
            '祖師堂與正覺寺': '祖師堂與正覺寺的建設記錄，共 4 筆。',
            '摧邪顯正': '法義辨正、破斥邪見、護法聲明等記錄，共 82 筆。',
            '社會公益': '慈善捐助、醫療與教育等公益行動。',
            '推廣活動': '公益推廣、講座、系列活動等大眾接觸法義的紀錄。'
        };

        // 資料分類
        function categorizeData(data) {
            const categorized = {
                '總表': data,
                '平實導師': [],
                '講經': [],
                '出版品': [],
                '開課與禪修': [],
                '弘法事務': [],
                '法會': [],
                '祖師堂與正覺寺': [],
                '摧邪顯正': [],
                '社會公益': [],
                '推廣活動': []
            };

            const seen = {};
            Object.keys(categorized).forEach(key => {
                seen[key] = new Set();
            });

            data.forEach(item => {
                if (item.categories && Array.isArray(item.categories)) {
                    item.categories.forEach(category => {
                        if (categorized[category] && !seen[category].has(item.id)) {
                            seen[category].add(item.id);
                            categorized[category].push(item);
                        }
                        if (category === '社會服務') {
                            ['社會公益', '推廣活動'].forEach(key => {
                                if (!seen[key].has(item.id)) {
                                    seen[key].add(item.id);
                                    categorized[key].push(item);
                                }
                            });
                        }
                        if (category === '開課' || category === '禪修') {
                            const key = '開課與禪修';
                            if (!seen[key].has(item.id)) {
                                seen[key].add(item.id);
                                categorized[key].push(item);
                            }
                        }
                    });
                }
            });

            return categorized;
        }

        let currentCategory = '總表';
        let categorizedData = {};
        let sortOrder = 'asc';
        let searchKeyword = '';
        let publicationView = 'events';
        let catalogSort = { field: 'category', order: 'asc' };

        function resetSearch() {
            searchKeyword = '';
            const inputs = [document.getElementById('searchInput'), document.getElementById('catalogSearchInput')];
            inputs.forEach(inp => { if (inp) inp.value = ''; });
            closeSearch('events', false);
            closeSearch('catalog', false);
        }

        // 高亮關鍵字
        function highlightText(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // 渲染表格
        function renderTable(category) {
            const tableBody = document.getElementById('eventTable');
            tableBody.innerHTML = '';

            let data = categorizedData[category] || [];

            // 搜尋篩選
            if (searchKeyword) {
                data = data.filter(item => {
                    const searchText = (item.column3 + ' ' + item.column4).toLowerCase();
                    return searchText.includes(searchKeyword.toLowerCase());
                });
            }

            // 排序
            const sortedData = [...data].sort((a, b) => {
                if (sortOrder === 'asc') {
                    return a.id - b.id;
                } else {
                    return b.id - a.id;
                }
            });

            // 生成表格行
            sortedData.forEach((item) => {
                const row = document.createElement('tr');
                const hasNote = item.column4 && item.column4.trim() !== '';

                const highlightedEvent = highlightText(item.column3, searchKeyword);

                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.column2}</td>
                    <td>
                        ${highlightedEvent}
                        ${hasNote ? `<span class="note-icon" onclick="openNoteModal(${item.id})" title="查看備註">📝</span>` : ''}
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updateDescription(category);
        }

        function renderPublicationCatalog() {
            const catalogBody = document.getElementById('catalogTableBody');
            catalogBody.innerHTML = '';

            if (typeof publicationsCatalog === 'undefined') {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="6">出版品目錄未載入</td>`;
                catalogBody.appendChild(row);
                return;
            }

            let data = [...publicationsCatalog];

            if (searchKeyword) {
                data = data.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    return title.includes(searchKeyword.toLowerCase());
                });
            }

            if (catalogSort.field) {
                data.sort((a, b) => {
                    const av = (a[catalogSort.field] || '').toString();
                    const bv = (b[catalogSort.field] || '').toString();
                    return catalogSort.order === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
                });
            }

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.category || ''}</td>
                    <td>${highlightText(item.title || '', searchKeyword)}</td>
                    <td>${item.publishDate || ''}</td>
                    <td>${item.note || ''}</td>
                `;
                catalogBody.appendChild(row);
            });

            updateCatalogSortIndicators();
            updateDescription(currentCategory);
        }

        function setPublicationSubTabActive() {
            const subTabs = document.querySelectorAll('#publicationSubTabs .sub-tab');
            subTabs.forEach(tab => {
                const view = tab.getAttribute('data-view');
                tab.classList.toggle('active', view === publicationView);
            });
        }

        function updateCatalogSortIndicators() {
            const mapping = {
                category: 'catalogSortCategory',
                publishDate: 'catalogSortPublish'
            };
            Object.keys(mapping).forEach(key => {
                const el = document.getElementById(mapping[key]);
                if (!el) return;
                if (catalogSort.field === key) {
                    el.textContent = catalogSort.order === 'asc' ? '▼' : '▲';
                } else {
                    el.textContent = '▼';
                }
            });
        }

        function renderCurrentView() {
            if (currentCategory === '出版品' && publicationView === 'catalog') {
                renderPublicationCatalog();
            } else {
                renderTable(currentCategory);
            }
        }

        function updateCategoryUI() {
            const subTabContainer = document.getElementById('publicationSubTabs');
            const eventsContainer = document.getElementById('eventsTableContainer');
            const catalogContainer = document.getElementById('catalogTableContainer');

            if (currentCategory === '出版品') {
                subTabContainer.classList.remove('hidden');
                setPublicationSubTabActive();
                if (publicationView === 'catalog') {
                    eventsContainer.classList.add('hidden');
                    catalogContainer.classList.remove('hidden');
                    closeSearch(false);
                } else {
                    eventsContainer.classList.remove('hidden');
                    catalogContainer.classList.add('hidden');
                }
            } else {
                subTabContainer.classList.add('hidden');
                eventsContainer.classList.remove('hidden');
                catalogContainer.classList.add('hidden');
                publicationView = 'events';
            }

            renderCurrentView();
        }

        function switchPublicationView(view) {
            publicationView = view;
            resetSearch();
            setPublicationSubTabActive();
            updateCategoryUI();
        }

        function toggleCatalogSort(field) {
            if (catalogSort.field === field) {
                catalogSort.order = catalogSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                catalogSort.field = field;
                catalogSort.order = 'asc';
            }
            renderPublicationCatalog();
        }

        // 切換分類
        function switchTab(category, el) {
            currentCategory = category;
            publicationView = 'events';

            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if (el) {
                el.classList.add('active');
            }

            resetSearch();
            updateCategoryUI();
        }

        // 切換排序
        function toggleSort() {
            if (currentCategory === '出版品' && publicationView === 'catalog') {
                return;
            }
            sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            document.getElementById('sortIndicator').textContent = sortOrder === 'asc' ? '▼' : '▲';
            renderCurrentView();
        }

        // 切換搜尋框
        function closeSearch(target = 'events', shouldRender = true) {
            const container = target === 'catalog' ? document.getElementById('catalogSearchContainer') : document.getElementById('searchContainer');
            const input = target === 'catalog' ? document.getElementById('catalogSearchInput') : document.getElementById('searchInput');
            if (container && container.classList.contains('show')) {
                container.classList.remove('show');
                if (input) input.value = '';
                searchKeyword = '';
                if (shouldRender) {
                    renderCurrentView();
                }
            }
        }

        function toggleSearch(target = 'events', e) {
            if (e) {
                e.stopPropagation();
            }
            const container = target === 'catalog' ? document.getElementById('catalogSearchContainer') : document.getElementById('searchContainer');
            const input = target === 'catalog' ? document.getElementById('catalogSearchInput') : document.getElementById('searchInput');

            if (!container || !input) return;

            if (container.classList.contains('show')) {
                closeSearch(target);
            } else {
                container.classList.add('show');
                input.focus();
            }
        }

        // 處理搜尋
        function handleSearch(target = 'events') {
            const input = target === 'catalog' ? document.getElementById('catalogSearchInput') : document.getElementById('searchInput');
            searchKeyword = input ? input.value.trim() : '';
            renderCurrentView();
        }

        // 更新說明
        function updateDescription(category) {
            document.getElementById('categoryDescription').textContent = categoryDescriptions[category];
        }

        // 開啟 Modal
        function openNoteModal(id) {
            const item = tableData.find(d => d.id === id);
            
            if (item) {
                document.getElementById('modalDate').textContent = item.column2;
                document.getElementById('modalEvent').innerHTML = highlightText(item.column3, searchKeyword);
                let noteText = item.column4;
                if (id === 1) {
                    noteText = noteText.replace('平實導師', `<a class="modern-link" href="https://www.enlighten.org.tw/master-pingsxiao" target="_blank" rel="noopener">平實導師</a>`);
                }
                document.getElementById('modalNote').innerHTML = highlightText(noteText, searchKeyword);
                
                document.getElementById('noteModal').classList.add('show');
            }
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('noteModal').classList.remove('show');
        }

        // 點擊外部關閉 Modal
        document.getElementById('noteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC 鍵關閉 Modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof tableData !== 'undefined') {
                console.log('資料已載入，共 ' + tableData.length + ' 筆');
                categorizedData = categorizeData(tableData);
                setPublicationSubTabActive();
                updateCategoryUI();
                updateCatalogSortIndicators();
            } else {
                console.error('資料未載入！請確認 table_data.js 檔案存在。');
                alert('資料載入失敗！請確認 table_data.js 檔案與此 HTML 檔案在同一目錄。');
            }

            const searchContainer = document.getElementById('searchContainer');
            searchContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            const catalogSearchContainer = document.getElementById('catalogSearchContainer');
            catalogSearchContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.addEventListener('click', function(e) {
                const header = document.getElementById('eventHeader');
                if (searchContainer.classList.contains('show') && !searchContainer.contains(e.target) && !header.contains(e.target)) {
                    closeSearch('events', false);
                }
                const catalogHeader = document.querySelector('.catalog-title-header');
                if (catalogSearchContainer.classList.contains('show') && catalogHeader && !catalogSearchContainer.contains(e.target) && !catalogHeader.contains(e.target)) {
                    closeSearch('catalog', false);
                }
            });
        });
    </script>
</body>
</html>
