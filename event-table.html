    <!-- Main JavaScript -->
    <script>
        'use strict';

        // ===== 狀態 =====
        const STORAGE_KEY = 'chronology_working_tags_v2';   // 0809 版分類方案
        const OVERVIEW = '總表';
        const COMPARE_MODE = 'COMPARE';   // 各案比對＋現場操作
        const WORKING_MODE = 'W';         // 現場版（依現場標籤成立分頁籤）
        const PUBLICATION_TABS = ['出版流通', '出版流通與管理', '出版流通管理', '書刊媒體'];

        let currentProposal = '';         // 初始化時設為第一個提案；另有 W（現場版）與 COMPARE
        let currentCategory = OVERVIEW;
        let categorizedData = {};
        let sortOrder = 'asc';
        let searchKeyword = '';
        let publicationView = 'events';
        let catalogSort = { field: 'category', order: 'asc' };

        // 現場操作標籤：{ 大事序號: [標籤, ...] }
        let workingTags = {};
        // 使用者自訂（非各案既有）的標籤名稱
        let customTagPool = [];
        let editingEventId = null;

        // ===== 現場標籤的存取（localStorage，GitHub Pages 純前端可用）=====
        // 每一次勾選／取消／新增標籤都立即寫入，因此重整、當機、關分頁都不會遺失。
        const HISTORY_KEY = 'chronology_working_tags_history_v2';
        const HISTORY_MAX = 30;
        let storageOK = true;          // 瀏覽器是否可用 localStorage
        let dirtySinceExport = false;  // 自上次匯出後是否有異動

        function storageAvailable() {
            try {
                const probe = '__chronology_probe__';
                localStorage.setItem(probe, '1');
                localStorage.removeItem(probe);
                return true;
            } catch (err) {
                return false;
            }
        }

        function loadWorking() {
            storageOK = storageAvailable();
            if (!storageOK) return;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    workingTags = parsed.tags || {};
                    customTagPool = parsed.customPool || [];
                }
            } catch (err) {
                console.warn('讀取現場標籤失敗，將以空白開始：', err);
                workingTags = {};
                customTagPool = [];
            }
        }

        // 變更前先把「上一版」推入歷史，供誤刪／誤清除時復原
        function pushHistory() {
            if (!storageOK) return;
            try {
                const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                hist.push({ tags: workingTags, customPool: customTagPool, at: new Date().toISOString() });
                while (hist.length > HISTORY_MAX) hist.shift();
                localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
            } catch (err) {
                console.warn('寫入歷史紀錄失敗：', err);
            }
        }

        function historyLength() {
            if (!storageOK) return 0;
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]').length;
            } catch (err) {
                return 0;
            }
        }

        function undoLast() {
            let hist;
            try {
                hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            } catch (err) {
                hist = [];
            }
            if (!hist.length) return;
            const prev = hist.pop();
            workingTags = prev.tags || {};
            customTagPool = prev.customPool || [];
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    tags: workingTags, customPool: customTagPool, savedAt: new Date().toISOString()
                }));
            } catch (err) {
                console.warn('復原時寫入失敗：', err);
            }
            updateSaveStatus();
            renderCompareTable();
            if (editingEventId !== null) renderTagOptions();
        }

        // 注意：pushHistory() 必須在異動「之前」呼叫，才會存下上一版。
        function saveWorking() {
            if (!storageOK) {
                dirtySinceExport = true;
                updateSaveStatus(false);
                return;
            }
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    tags: workingTags,
                    customPool: customTagPool,
                    savedAt: new Date().toISOString()
                }));
                dirtySinceExport = true;
                updateSaveStatus(true);
            } catch (err) {
                console.error('儲存現場標籤失敗：', err);
                storageOK = false;
                dirtySinceExport = true;
                updateSaveStatus(false);
            }
        }

        function markedCount() {
            return Object.keys(workingTags).filter(k => workingTags[k] && workingTags[k].length).length;
        }

        function updateSaveStatus(ok) {
            const el = document.getElementById('saveStatus');
            const undo = document.getElementById('undoBtn');
            if (!el) return;
            const n = markedCount();
            // 併入說明列時使用精簡文字，確保工具列不換行
            const brief = document.getElementById('toolbar').classList.contains('inline-toolbar');
            if (ok === false || !storageOK) {
                el.className = 'save-status failed';
                el.textContent = brief ? '⚠ 無法自動儲存' : '⚠ 無法自動儲存！請立即按「備份 JSON」或匯出';
            } else if (n === 0) {
                el.className = 'save-status';
                el.textContent = '尚未編輯';
            } else if (dirtySinceExport) {
                el.className = 'save-status dirty';
                el.textContent = brief
                    ? `✓ 已存 ${n} 則．未匯出`
                    : `✓ 已自動儲存 ${new Date().toLocaleTimeString('zh-TW', { hour12: false })}（${n} 則）．尚未匯出`;
            } else {
                el.className = 'save-status';
                el.textContent = brief ? `✓ 已存並匯出（${n}）` : `✓ 已自動儲存並已匯出（${n} 則）`;
            }
            if (undo) undo.disabled = historyLength() === 0;
        }

        // 有未匯出的異動時，重整／關閉分頁前提醒
        window.addEventListener('beforeunload', function (e) {
            if (dirtySinceExport && markedCount() > 0) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        // 儲存環境不可用（無痕視窗、停用 Cookie／網站資料）時明確警告
        function showStorageWarning() {
            if (storageOK) return;
            const bar = document.createElement('div');
            bar.className = 'storage-warning';
            bar.innerHTML = '<strong>注意：這個瀏覽器無法自動存檔</strong>（可能是無痕／私密視窗，或停用了網站資料）。'
                + '現場操作的標籤只存在記憶體中，<strong>一重整就會全部消失</strong>。'
                + '請改用一般視窗，或在討論結束前務必按「備份 JSON」／「匯出 Excel」帶走成果。';
            const meta = document.getElementById('proposalMeta');
            meta.parentNode.insertBefore(bar, meta);
        }

        // 取得某則大事在某提案的分類
        // 現場操作欄未經編輯時，預設帶入達共識門檻（半數以上提案採用）的標籤
        function tagsOf(id, proposalId) {
            if (proposalId === WORKING_MODE) {
                return workingTags[id] ? workingTags[id].slice() : majorityTags(id);
            }
            const rec = eventProposalCategories[id];
            return rec && rec[proposalId] ? rec[proposalId].slice() : [];
        }

        // 所有提案的代號（依 proposals_data.js 的順序）
        function proposalIds() {
            return proposals.map(p => p.id);
        }

        // 分類正規化：畫面上照錄原文，但計票與歸類時視為同一分類
        // （例：共修活動＝共修紀事、破邪顯正＝摧邪顯正）
        function canon(name) {
            return (typeof tagAliases !== 'undefined' && tagAliases[name]) ? tagAliases[name] : name;
        }

        function canonList(list) {
            const out = [];
            list.forEach(t => {
                const c = canon(t);
                if (out.indexOf(c) === -1) out.push(c);
            });
            return out;
        }

        // 共識門檻：半數以上的提案採用（六案時為 3 案以上）
        function consensusThreshold() {
            return Math.max(2, Math.ceil(proposals.length / 2));
        }

        // 預設值：達共識門檻的標籤，票數多者在前
        function majorityTags(id) {
            const votes = {};
            const th = consensusThreshold();
            proposalIds().forEach(p => canonList(tagsOf(id, p)).forEach(t => { votes[t] = (votes[t] || 0) + 1; }));
            return Object.keys(votes)
                .filter(t => votes[t] >= th)
                .sort((a, b) => votes[b] - votes[a]);
        }

        // 該則是否已由使用者實際編輯過（未編輯者顯示的是多數決預設值）
        function isEdited(id) {
            return Object.prototype.hasOwnProperty.call(workingTags, id);
        }

        function getProposal(pid) {
            return proposals.find(p => p.id === pid);
        }

        // 各案標籤是否完全一致（名稱完全相同才算一致）
        function hasDiff(id) {
            const sets = proposalIds().map(p => canonList(tagsOf(id, p)).sort().join('｜'));
            return sets.some(x => x !== sets[0]);
        }

        // 各案共通的標籤名稱（用來判斷是否標示差異）
        function commonTags(id) {
            const ids = proposalIds();
            const first = canonList(tagsOf(id, ids[0]));
            return first.filter(t => ids.every(p => canonList(tagsOf(id, p)).indexOf(t) !== -1));
        }

        // 某個標籤被幾案採用（等價分類合併計算）
        function tagAgreement(id, name) {
            const c = canon(name);
            return proposalIds().filter(p => canonList(tagsOf(id, p)).indexOf(c) !== -1).length;
        }

        // 全部可選標籤（各案 + 現場自訂）
        function allTagPool() {
            const pool = [];
            proposals.forEach(p => p.tabs.forEach(t => {
                if (!pool.some(x => x.name === t.name)) pool.push({ name: t.name, from: [] });
                pool.find(x => x.name === t.name).from.push(p.name);
            }));
            customTagPool.forEach(name => {
                if (!pool.some(x => x.name === name)) pool.push({ name: name, from: ['自訂'] });
            });
            return pool;
        }

        // 現場版分頁籤：依目前實際使用中的標籤成立
        function workingTabNames() {
            const used = [];
            tableData.forEach(item => {
                tagsOf(item.id, WORKING_MODE).forEach(t => {
                    if (used.indexOf(t) === -1) used.push(t);
                });
            });
            // 依各案既有順序排列，其餘（自訂）排在後面
            const ordered = [];
            proposals.forEach(p => p.tabs.forEach(t => {
                if (used.indexOf(t.name) !== -1 && ordered.indexOf(t.name) === -1) ordered.push(t.name);
            }));
            used.forEach(t => { if (ordered.indexOf(t) === -1) ordered.push(t); });
            return ordered;
        }

        // 動態計算某提案（或現場操作）各分類的大事筆數
        function categoryCounts(proposalId) {
            const counts = {};
            tableData.forEach(item => {
                canonList(tagsOf(item.id, proposalId)).forEach(t => {
                    counts[t] = (counts[t] || 0) + 1;
                });
            });
            return counts;
        }

        // 現場操作的整體統計
        function workingStats() {
            const counts = categoryCounts(WORKING_MODE);
            let classified = 0, pending = 0, confirmed = 0;
            tableData.forEach(item => {
                const tags = tagsOf(item.id, WORKING_MODE);
                if (tags.length) classified++; else pending++;
                if (isEdited(item.id)) confirmed++;
            });
            const totalTags = Object.keys(counts).reduce((a, k) => a + counts[k], 0);
            return { counts: counts, classified: classified, pending: pending,
                     confirmed: confirmed, totalTags: totalTags };
        }

        // 目前提案的分頁籤清單
        function currentTabs() {
            if (currentProposal === WORKING_MODE) {
                return workingTabNames().map(name => ({ name: name, desc: '現場操作標籤所成立之分頁籤。' }));
            }
            const p = getProposal(currentProposal);
            return p ? p.tabs : [];
        }

        // 依目前提案重建分類資料
        function categorizeData() {
            const categorized = {};
            categorized[OVERVIEW] = tableData;
            currentTabs().forEach(t => { categorized[t.name] = []; });
            tableData.forEach(item => {
                canonList(tagsOf(item.id, currentProposal)).forEach(cat => {
                    if (categorized[cat]) categorized[cat].push(item);
                });
            });
            return categorized;
        }

        function resetSearch() {
            searchKeyword = '';
            const inputs = [document.getElementById('searchInput'), document.getElementById('catalogSearchInput')];
            inputs.forEach(inp => { if (inp) inp.value = ''; });
            closeSearch('events', false);
            closeSearch('catalog', false);
        }

        // Highlight Keywords
        function highlightText(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Apply Hyperlinks to text
        function applyHyperlinks(text, hyperlinks) {
            if (!hyperlinks || !Array.isArray(hyperlinks) || hyperlinks.length === 0) {
                return text;
            }
            let result = text;
            hyperlinks.forEach(link => {
                if (link.text && link.url) {
                    const escapedText = link.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escapedText, 'g');
                    result = result.replace(regex, `<a href="${link.url}" class="event-link" target="_blank" rel="noopener">${link.text}</a>`);
                }
            });
            return result;
        }

        // Render Table
        function renderTable(category) {
            const tableBody = document.getElementById('eventTable');
            tableBody.innerHTML = '';

            let data = categorizedData[category] || [];

            // Search Filter
            if (searchKeyword) {
                data = data.filter(item => {
                    const searchText = (item.column3 + ' ' + item.column4).toLowerCase();
                    return searchText.includes(searchKeyword.toLowerCase());
                });
            }

            // Sort
            const sortedData = [...data].sort((a, b) => {
                return sortOrder === 'asc' ? a.id - b.id : b.id - a.id;
            });

            // 如果有搜尋但無結果，顯示提示
            if (searchKeyword && sortedData.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="3" class="no-results">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <h3>無搜尋結果</h3>
                        <p>找不到包含「${searchKeyword}」的相關內容</p>
                    </td>
                `;
                tableBody.appendChild(row);
                updateDescription(category, 0);
                return;
            }

            // Generate Table Rows
            sortedData.forEach((item) => {
                const row = document.createElement('tr');
                const hasNote = item.column4 && item.column4.trim() !== '';

                // 檢查搜尋關鍵字是否在紀要中
                const noteHasKeyword = searchKeyword && hasNote &&
                    item.column4.toLowerCase().includes(searchKeyword.toLowerCase());

                // Apply hyperlinks first, then highlight search keywords
                let eventText = applyHyperlinks(item.column3, item.hyperlinks);
                eventText = highlightText(eventText, searchKeyword);

                // 總表：一併顯示該則大事在目前提案中的分類標籤
                const tags = tagsOf(item.id, currentProposal);
                // 總表的標籤可點擊，直接跳到該分頁籤並定位到同一則大事
                const tagsHtml = (category === OVERVIEW && tags.length)
                    ? `<span class="row-tags">${tags.map(t =>
                        `<button type="button" class="tag tag-link" title="跳到「${escapeHtml(t)}」分頁籤的這一則"`
                        + ` onclick="jumpToTab('${escapeHtml(t).replace(/'/g, "&#39;")}', ${item.id})">`
                        + `${escapeHtml(t)}</button>`).join('')}</span>`
                    : '';

                row.setAttribute('data-event-id', item.id);
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.column2}</td>
                    <td>
                        ${eventText}
                        ${hasNote ? `
                            <button class="note-link-btn ${noteHasKeyword ? 'highlight-note' : ''}" onclick="openNoteModal(${item.id})" title="查看紀要">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                                </svg>
                                紀要
                            </button>
                        ` : ''}
                        ${tagsHtml}
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updateDescription(category, sortedData.length);
        }

        function renderPublicationCatalog() {
            const catalogBody = document.getElementById('catalogTableBody');
            catalogBody.innerHTML = '';

            if (typeof publicationsCatalog === 'undefined') {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="5">出版品目錄未載入</td>`;
                catalogBody.appendChild(row);
                return;
            }

            let data = [...publicationsCatalog];

            if (searchKeyword) {
                data = data.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    return title.includes(searchKeyword.toLowerCase());
                });
            }

            // 如果有搜尋但無結果，顯示提示
            if (searchKeyword && data.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="5" class="no-results">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <h3>無搜尋結果</h3>
                        <p>找不到包含「${searchKeyword}」的出版品</p>
                    </td>
                `;
                catalogBody.appendChild(row);
                updateCatalogSortIndicators();
                return;
            }

            if (catalogSort.field) {
                data.sort((a, b) => {
                    const av = (a[catalogSort.field] || '').toString();
                    const bv = (b[catalogSort.field] || '').toString();
                    return catalogSort.order === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
                });
            }

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.category || ''}</td>
                    <td>${highlightText(item.title || '', searchKeyword)}</td>
                    <td>${item.publishDate || ''}</td>
                    <td>${item.note || ''}</td>
                `;
                catalogBody.appendChild(row);
            });

            updateCatalogSortIndicators();
        }

        function setPublicationSubTabActive() {
            const subTabs = document.querySelectorAll('#publicationSubTabs .sub-tab');
            subTabs.forEach(tab => {
                const view = tab.getAttribute('data-view');
                tab.classList.toggle('active', view === publicationView);
            });
        }

        function updateCatalogSortIndicators() {
            const mapping = {
                category: 'catalogSortCategory',
                publishDate: 'catalogSortPublish'
            };
            Object.keys(mapping).forEach(key => {
                const el = document.getElementById(mapping[key]);
                if (!el) return;
                el.textContent = catalogSort.field === key
                    ? (catalogSort.order === 'asc' ? '▼' : '▲')
                    : '▼';
            });
        }

        function renderCurrentView() {
            if (currentProposal === COMPARE_MODE) {
                renderCompareTable();
            } else if (isPublicationTab(currentCategory) && publicationView === 'catalog') {
                renderPublicationCatalog();
            } else {
                renderTable(currentCategory);
            }
        }

        function isPublicationTab(name) {
            return PUBLICATION_TABS.indexOf(name) !== -1;
        }

        function updateCategoryUI() {
            const subTabContainer = document.getElementById('publicationSubTabs');
            const eventsContainer = document.getElementById('eventsTableContainer');
            const catalogContainer = document.getElementById('catalogTableContainer');
            const compareContainer = document.getElementById('compareTableContainer');
            const toolbar = document.getElementById('toolbar');
            const tabsBar = document.getElementById('tabs');

            const infoBar = document.querySelector('.category-info-bar');

            if (currentProposal === COMPARE_MODE) {
                subTabContainer.classList.add('hidden');
                eventsContainer.classList.add('hidden');
                catalogContainer.classList.add('hidden');
                compareContainer.classList.remove('hidden');
                // 若工具列先前被併入說明列，先移回原位再顯示
                if (toolbar.parentNode === infoBar) {
                    infoBar.parentNode.insertBefore(toolbar, subTabContainer);
                }
                toolbar.classList.remove('hidden', 'inline-toolbar');
                infoBar.classList.remove('with-toolbar');
                document.getElementById('diffFilterLabel').classList.remove('hidden');
                tabsBar.classList.add('hidden');
                // 比對模式的說明已在提案說明列呈現，隱藏重複的分類說明欄以騰出高度
                infoBar.classList.add('hidden');
                document.getElementById('liveStats').classList.remove('hidden');
                renderCompareTable();
                return;
            }

            document.getElementById('liveStats').classList.toggle('hidden', currentProposal !== WORKING_MODE);
            if (currentProposal === WORKING_MODE) renderLiveStats();

            infoBar.classList.remove('hidden');
            compareContainer.classList.add('hidden');
            tabsBar.classList.remove('hidden');
            // 現場版同樣提供匯出工具，但不需要差異篩選；
            // 工具列併入說明列同一行，避免多佔一整行高度
            if (currentProposal === WORKING_MODE) {
                toolbar.classList.remove('hidden');
                toolbar.classList.add('inline-toolbar');
                infoBar.classList.add('with-toolbar');
                infoBar.appendChild(toolbar);
                document.getElementById('diffFilterLabel').classList.add('hidden');
                updateSaveStatus();
            } else {
                toolbar.classList.add('hidden');
                toolbar.classList.remove('inline-toolbar');
                infoBar.classList.remove('with-toolbar');
                if (toolbar.parentNode === infoBar) {
                    infoBar.parentNode.insertBefore(toolbar, subTabContainer);
                }
                updateSaveStatus();
            }

            if (isPublicationTab(currentCategory)) {
                subTabContainer.classList.remove('hidden');
                setPublicationSubTabActive();
                if (publicationView === 'catalog') {
                    eventsContainer.classList.add('hidden');
                    catalogContainer.classList.remove('hidden');
                } else {
                    eventsContainer.classList.remove('hidden');
                    catalogContainer.classList.add('hidden');
                }
            } else {
                subTabContainer.classList.add('hidden');
                eventsContainer.classList.remove('hidden');
                catalogContainer.classList.add('hidden');
                publicationView = 'events';
            }

            renderCurrentView();
        }

        // ===== 提案切換列與分頁籤 =====
        // 目前檢視的名稱（收合時顯示於切換鈕上）
        function currentViewName() {
            if (currentProposal === COMPARE_MODE) return '各案比對＋現場操作';
            if (currentProposal === WORKING_MODE) return '現場版（現場標籤）';
            const p = getProposal(currentProposal);
            return p ? p.name : '';
        }

        function isNarrow() {
            if (typeof window.matchMedia === 'function') {
                return window.matchMedia('(max-width: 768px)').matches;
            }
            return (window.innerWidth || document.documentElement.clientWidth || 0) <= 768;
        }

        // 手機版：提案列可展開／收合，避免 8 個按鈕佔掉表格高度
        function toggleProposalBar() {
            const bar = document.getElementById('proposalBar');
            bar.classList.toggle('collapsed');
            updateBarToggle();
        }

        function updateBarToggle() {
            const bar = document.getElementById('proposalBar');
            const btn = document.getElementById('barToggle');
            if (!btn) return;
            const collapsed = bar.classList.contains('collapsed');
            btn.innerHTML = `<span class="bt-name">${escapeHtml(currentViewName())}</span>`
                + `<span class="bt-arrow">${collapsed ? '▼' : '▲'}</span>`;
            btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            btn.title = collapsed ? '展開提案列表' : '收合提案列表';
        }

        function renderProposalBar() {
            const bar = document.getElementById('proposalBar');
            const wasCollapsed = bar.classList.contains('collapsed');
            bar.innerHTML = '<span class="bar-label">分頁籤提案：</span>'
                + '<button type="button" class="bar-toggle" id="barToggle" onclick="toggleProposalBar()"></button>';

            const group = document.createElement('div');
            group.className = 'proposal-btns';

            proposals.forEach(p => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'proposal-btn' + (currentProposal === p.id ? ' active' : '');
                btn.textContent = p.name;
                btn.onclick = () => switchProposal(p.id);
                group.appendChild(btn);
            });

            const wBtn = document.createElement('button');
            wBtn.type = 'button';
            wBtn.className = 'proposal-btn working-btn' + (currentProposal === WORKING_MODE ? ' active' : '');
            wBtn.textContent = '現場版（現場標籤）';
            wBtn.onclick = () => switchProposal(WORKING_MODE);
            group.appendChild(wBtn);

            const cBtn = document.createElement('button');
            cBtn.type = 'button';
            cBtn.className = 'proposal-btn compare-btn' + (currentProposal === COMPARE_MODE ? ' active' : '');
            cBtn.textContent = '各案比對＋現場操作';
            cBtn.onclick = () => switchProposal(COMPARE_MODE);
            group.appendChild(cBtn);

            bar.appendChild(group);
            // 手機版預設收合；桌機版不受影響（CSS 中不套用 collapsed）
            bar.classList.toggle('collapsed', wasCollapsed || isNarrow());
            updateBarToggle();
        }

        function setMeta(html) {
            const meta = document.getElementById('proposalMeta');
            const expanded = meta.classList.contains('expanded');
            meta.innerHTML = `<span class="meta-text">${html}</span>`
                + `<button type="button" class="meta-toggle" onclick="toggleMeta()">${expanded ? '收合' : '詳細'}</button>`;
        }

        function toggleMeta() {
            const meta = document.getElementById('proposalMeta');
            meta.classList.toggle('expanded');
            const btn = meta.querySelector('.meta-toggle');
            if (btn) btn.textContent = meta.classList.contains('expanded') ? '收合' : '詳細';
        }

        function renderProposalMeta() {
            if (currentProposal === COMPARE_MODE) {
                const diffCount = tableData.filter(it => hasDiff(it.id)).length;
                const pending = tableData.filter(it => !isEdited(it.id) && majorityTags(it.id).length === 0).length;
                const edited = markedCount();
                const n = proposals.length;
                const th = consensusThreshold();
                setMeta(`<strong>各案比對＋現場操作：</strong>依總表原始順序並列 ${n} 份提案對同一則大事的分類。`
                    + `標籤色別：<span class="tag">${n} 案一致</span><span class="tag partial">達 ${th} 案以上</span><span class="tag diff">未達 ${th} 案</span>。`
                    + `目前 ${tableData.length} 則中有 <strong>${diffCount}</strong> 則各案分類不完全一致。`
                    + `最右欄預設帶入<span class="tag preset">半數以上（${th} 案以上）採用</span>之標籤，`
                    + `其中 <strong>${pending}</strong> 則未達門檻，標為`
                    + `<span class="tag pending">各案分歧．待決定</span>；已現場確認 <strong>${edited}</strong> 則。`
                    + `點「編輯」可多選或自訂分類，上方統計列會即時反映各分類筆數。`);
                return;
            }
            if (currentProposal === WORKING_MODE) {
                const classified = tableData.filter(it => tagsOf(it.id, WORKING_MODE).length).length;
                setMeta(`<strong>現場版：</strong>預設以「半數以上（${consensusThreshold()} 案以上）採用」的標籤歸類，並即時反映「各案比對＋現場操作」頁面中的調整。`
                    + `目前已歸類 <strong>${classified}</strong> / ${tableData.length} 則，`
                    + `其中 <strong>${markedCount()}</strong> 則經現場確認，分頁籤 <strong>${workingTabNames().length}</strong> 個。`);
                return;
            }
            const p = getProposal(currentProposal);
            setMeta(`<strong>分類依據：</strong>${p.intro}`
                + (p.note ? `<span class="meta-note">※ ${p.note}</span>` : ''));
        }

        function renderTabs() {
            const tabsBar = document.getElementById('tabs');
            tabsBar.innerHTML = '';
            const tabs = [{ name: OVERVIEW }].concat(currentTabs());
            const counts = categoryCounts(currentProposal);
            tabs.forEach(t => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab' + (currentCategory === t.name ? ' active' : '')
                    + (isPublicationTab(t.name) ? ' publication-tab' : '');
                const n = t.name === OVERVIEW ? tableData.length : (counts[t.name] || 0);
                btn.innerHTML = `${escapeHtml(t.name)}<span class="tab-count">${n}</span>`;
                btn.onclick = function () { switchTab(t.name, this); };
                tabsBar.appendChild(btn);
            });
            if (tabs.length === 1) {
                const hint = document.createElement('span');
                hint.style.cssText = 'padding:16px;color:#a05a2c;font-size:13px;';
                hint.textContent = '尚未輸入任何現場標籤，請至「各案比對＋現場操作」頁面編輯。';
                tabsBar.appendChild(hint);
            }
        }

        // 由總表的標籤跳到該分頁籤，並定位、閃示同一則大事
        // （月英淑妙淑滿提案之建議：總表各則事件以超連結連到後面分頁籤，便於前後查看）
        function jumpToTab(tagName, eventId) {
            if (currentTabs().every(t => t.name !== tagName)) return;
            currentCategory = tagName;
            publicationView = 'events';
            resetSearch();
            renderTabs();
            updateCategoryUI();
            setTimeout(() => highlightRow(eventId), 60);
        }

        function highlightRow(eventId) {
            const row = document.querySelector(`#eventTable tr[data-event-id="${eventId}"]`);
            if (!row) return;
            row.scrollIntoView({ block: 'center', behavior: 'smooth' });
            row.classList.remove('row-flash');
            void row.offsetWidth;          // 重新觸發動畫
            row.classList.add('row-flash');
            setTimeout(() => row.classList.remove('row-flash'), 3000);
        }

        function switchProposal(pid) {
            currentProposal = pid;
            currentCategory = OVERVIEW;
            publicationView = 'events';
            // 比對模式有五欄，放寬版面寬度
            document.body.classList.toggle('wide-mode', pid === COMPARE_MODE);
            resetSearch();
            renderProposalBar();
            if (isNarrow()) {
                document.getElementById('proposalBar').classList.add('collapsed');
                updateBarToggle();
            }
            renderProposalMeta();
            renderTabs();
            categorizedData = categorizeData();
            updateCategoryUI();
        }

        function switchPublicationView(view) {
            publicationView = view;
            resetSearch();
            setPublicationSubTabActive();
            updateCategoryUI();
        }

        function toggleCatalogSort(field) {
            if (catalogSort.field === field) {
                catalogSort.order = catalogSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                catalogSort.field = field;
                catalogSort.order = 'asc';
            }
            renderPublicationCatalog();
        }

        // Switch Category Tab
        function switchTab(category, el) {
            currentCategory = category;
            publicationView = 'events';

            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if (el) el.classList.add('active');

            resetSearch();
            updateCategoryUI();
        }

        // Toggle Sort
        function toggleSort() {
            if (isPublicationTab(currentCategory) && publicationView === 'catalog') return;
            sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            document.getElementById('sortIndicator').textContent = sortOrder === 'asc' ? '▼' : '▲';
            renderCurrentView();
        }

        // Close Search
        function closeSearch(target = 'events', shouldRender = true) {
            const container = target === 'catalog'
                ? document.getElementById('catalogSearchContainer')
                : document.getElementById('searchContainer');
            const input = target === 'catalog'
                ? document.getElementById('catalogSearchInput')
                : document.getElementById('searchInput');
            if (container && container.classList.contains('show')) {
                container.classList.remove('show');
                if (input) input.value = '';
                searchKeyword = '';
                if (shouldRender) renderCurrentView();
            }
        }

        // Toggle Search
        function toggleSearch(target = 'events', e) {
            if (e) e.stopPropagation();
            const container = target === 'catalog'
                ? document.getElementById('catalogSearchContainer')
                : document.getElementById('searchContainer');
            const input = target === 'catalog'
                ? document.getElementById('catalogSearchInput')
                : document.getElementById('searchInput');

            if (!container || !input) return;

            if (container.classList.contains('show')) {
                closeSearch(target);
            } else {
                container.classList.add('show');
                input.focus();
            }
        }

        // Handle Search
        function handleSearch(target = 'events') {
            const input = target === 'catalog'
                ? document.getElementById('catalogSearchInput')
                : document.getElementById('searchInput');
            const newKeyword = input ? input.value.trim() : '';

            // 如果使用者手動清空搜尋內容，關閉搜尋欄
            if (searchKeyword && !newKeyword) {
                closeSearch(target, true);
                return;
            }

            searchKeyword = newKeyword;
            renderCurrentView();
        }

        // Update Description（分頁籤開頭的分類依據說明欄）
        function updateDescription(category, count) {
            let desc;
            if (category === OVERVIEW) {
                desc = '正覺大事紀總表：大事依「大事紀1150630.xlsx」之原始序號、日期與紀要順序完整收錄；'
                    + '分類依「正覺大事紀_總表分類回傳檔-彙整0809.xlsx」六案照錄。';
            } else {
                const tab = currentTabs().find(t => t.name === category);
                desc = tab ? (tab.desc || '') : '';
            }
            // 提案原檔未附說明者留白，僅顯示筆數
            const countText = count !== undefined ? `共 ${count} 筆。` : '';
            document.getElementById('categoryDescription').textContent =
                desc ? (desc + '　' + countText) : countText;
        }

        // ===== 共用小工具 =====
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ===== 各案比對表 =====
        // 現場操作即時統計列：每個分類的筆數隨編輯即時更新
        function renderLiveStats() {
            const box = document.getElementById('liveStats');
            if (!box) return;
            const st = workingStats();
            const names = workingTabNames();

            let html = '<span class="ls-title">現場分類即時統計</span>';
            if (!names.length) {
                html += '<span style="color:#8a5a00;">尚無任何分類</span>';
            } else {
                html += names.map(n =>
                    `<button type="button" class="stat-chip" title="切到現場版的「${escapeHtml(n)}」分頁籤"`
                    + ` onclick="gotoWorkingTab('${escapeHtml(n).replace(/'/g, "&#39;")}')">`
                    + `${escapeHtml(n)}<span class="stat-num">${st.counts[n]}</span></button>`
                ).join('');
            }
            if (st.pending) {
                html += `<button type="button" class="stat-chip warn" title="尚未歸類，點此只顯示這些大事"`
                    + ` onclick="showPendingOnly()">待決定<span class="stat-num">${st.pending}</span></button>`;
            }
            html += `<span class="ls-sum">已歸類 <b>${st.classified}</b> / ${tableData.length} 則`
                + `｜分類數 <b>${names.length}</b>`
                + `｜標籤總數 <b>${st.totalTags}</b>`
                + `｜現場確認 <b>${st.confirmed}</b> 則</span>`;
            box.innerHTML = html;
        }

        // 從統計列跳到現場版的該分頁籤
        function gotoWorkingTab(name) {
            currentProposal = WORKING_MODE;
            currentCategory = name;
            publicationView = 'events';
            document.body.classList.remove('wide-mode');
            resetSearch();
            renderProposalBar();
            renderProposalMeta();
            renderTabs();
            categorizedData = categorizeData();
            updateCategoryUI();
        }

        // 只列出尚未歸類（待決定）的大事
        function showPendingOnly() {
            const cb = document.getElementById('pendingFilter');
            if (cb) {
                cb.checked = true;
                document.getElementById('diffFilter').checked = false;
                renderCompareTable();
            }
        }

        // 比對表表頭：大事欄與各提案、現場操作欄給予舒適寬度，支援內部水平捲動
        function renderCompareHead() {
            const head = document.getElementById('compareTableHead');
            head.innerHTML = '<tr>'
                + `<th class="col-event">大事（依總表原始順序）</th>`
                + proposals.map(p =>
                    `<th class="col-p">${escapeHtml(p.name)}</th>`).join('')
                + `<th class="col-w">現場操作（可編輯）</th>`
                + '</tr>';
        }

        function renderCompareTable() {
            const body = document.getElementById('compareTableBody');
            renderCompareHead();
            body.innerHTML = '';
            const onlyDiff = document.getElementById('diffFilter').checked;
            const onlyPending = document.getElementById('pendingFilter').checked;
            const colSpan = proposals.length + 2;

            let rows = tableData;
            if (onlyDiff) rows = rows.filter(item => hasDiff(item.id));
            if (onlyPending) rows = rows.filter(item => tagsOf(item.id, WORKING_MODE).length === 0);

            if (rows.length === 0) {
                body.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center;padding:30px;">沒有符合條件的大事</td></tr>`;
                return;
            }

            rows.forEach(item => {
                const diff = hasDiff(item.id);
                const common = commonTags(item.id);
                const tr = document.createElement('tr');
                if (diff) tr.className = 'has-diff';

                const cell = (pid) => {
                    const tags = tagsOf(item.id, pid);
                    if (!tags.length) return '<span class="tag empty">未歸類</span>';
                    return tags.map(t => {
                        const n = tagAgreement(item.id, t);
                        const all = proposals.length;
                        const th = consensusThreshold();
                        // 全案採用＝一般樣式、達共識門檻＝橘、未達門檻＝紅字螢光
                        const cls = n === all ? '' : (n >= th ? 'partial' : 'diff');
                        let title = n === all ? `${all} 案一致` : `${n} 案採用`;
                        // 原檔使用舊名稱者，畫面照錄原文，另以 ≡ 標示計票時視為同一分類
                        const alias = canon(t) !== t ? `<span class="alias-note">≡${escapeHtml(canon(t))}</span>` : '';
                        if (alias) title += `（原檔用語，計票時視為「${canon(t)}」）`;
                        return `<span class="tag ${cls}" title="${title}">${escapeHtml(t)}${alias}</span>`;
                    }).join('');
                };

                const wTags = tagsOf(item.id, WORKING_MODE);
                const edited = isEdited(item.id);
                let wHtml;
                if (wTags.length) {
                    // 已編輯者為實線綠標；未編輯者為多數決預設值，以虛線標示
                    const cls = edited ? 'custom' : 'preset';
                    const tip = edited ? '現場確認' : '多數提案採用（預設值，可編輯調整）';
                    wHtml = wTags.map(t => `<span class="tag ${cls}" title="${tip}">${escapeHtml(t)}</span>`).join('');
                } else {
                    wHtml = edited
                        ? '<span class="tag empty">未歸類</span>'
                        : '<span class="tag pending" title="未達半數共識，需現場決定">各案分歧．待決定</span>';
                }

                tr.innerHTML = `
                    <td class="event-cell">
                        <span class="ev-no">${item.id}</span>
                        <span class="ev-date">${escapeHtml(item.column2)}</span>
                        ${diff ? '<span class="diff-badge">分類有差異</span>' : `<span class="same-badge">${proposals.length} 案一致</span>`}
                        <span class="ev-title">${escapeHtml(item.column3)}</span>
                    </td>
                    ${proposalIds().map(pid => `<td class="tag-cell">${cell(pid)}</td>`).join('')}
                    <td class="tag-cell">
                        ${wHtml}<button class="edit-tag-btn" onclick="openTagModal(${item.id})">編輯</button>
                    </td>
                `;
                body.appendChild(tr);
            });

            renderProposalMeta();
            renderLiveStats();
        }

        // ===== 標籤編輯 Modal =====
        function openTagModal(id) {
            editingEventId = id;
            const item = tableData.find(d => d.id === id);
            document.getElementById('tagModalPreview').innerHTML =
                `<span class="ev-no">${item.id}</span><span class="ev-date">${escapeHtml(item.column2)}</span>`
                + `<div style="margin-top:6px;">${escapeHtml(item.column3)}</div>`;
            // 未編輯過者沿用畫面上的多數決預設值，待使用者實際勾選時才寫入
            renderTagOptions();
            document.getElementById('tagModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function renderTagOptions() {
            const container = document.getElementById('tagModalGroups');
            const selected = tagsOf(editingEventId, WORKING_MODE);
            const pool = allTagPool();

            // 先列出本則在各案的原分類，供對照
            let html = '<div class="tag-group"><h4>本則在各案的分類</h4><div class="origin-list">'
                + proposals.map(p =>
                    `<span><b>${escapeHtml(p.name)}</b>：${escapeHtml(tagsOf(editingEventId, p.id).join('、')) || '未歸類'}</span>`
                  ).join('')
                + '</div></div>';

            // 各案分頁籤彙整為唯一清單（同名只出現一次），並標示哪幾案採用
            html += '<div class="tag-group"><h4>可選分頁籤（各案彙整，可複選）</h4><div class="tag-options">';
            const seen = [];
            proposals.forEach(p => {
                p.tabs.forEach(t => {
                    if (seen.indexOf(t.name) !== -1) return;
                    seen.push(t.name);
                    const from = proposals
                        .filter(q => q.tabs.some(x => x.name === t.name))
                        .map(q => q.name.replace('提案', ''));
                    const mark = from.length === proposals.length ? '各案' : from.join('・');
                    html += tagOptionHtml(t.name, selected.indexOf(t.name) !== -1, mark);
                });
            });
            html += '</div></div>';

            const customs = pool.filter(x => x.from.indexOf('自訂') !== -1 && seen.indexOf(x.name) === -1);
            if (customs.length) {
                html += '<div class="tag-group"><h4>自訂標籤</h4><div class="tag-options">';
                customs.forEach(x => {
                    html += tagOptionHtml(x.name, selected.indexOf(x.name) !== -1, '');
                });
                html += '</div></div>';
            }

            container.innerHTML = html;
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function () {
                    toggleTag(this.value, this.checked);
                });
            });
        }

        function tagOptionHtml(name, checked, mark) {
            return `<label class="tag-option ${checked ? 'checked' : ''}">
                <input type="checkbox" value="${escapeHtml(name)}" ${checked ? 'checked' : ''}>
                ${escapeHtml(name)}${mark ? `<span class="origin-mark">（${escapeHtml(mark)}）</span>` : ''}
            </label>`;
        }

        function toggleTag(name, checked) {
            pushHistory();
            const list = workingTags[editingEventId] || tagsOf(editingEventId, WORKING_MODE);
            const idx = list.indexOf(name);
            if (checked && idx === -1) list.push(name);
            if (!checked && idx !== -1) list.splice(idx, 1);
            workingTags[editingEventId] = list;
            saveWorking();
            renderTagOptions();
            renderCompareTable();
            renderTabs();
        }

        function addCustomTagFromInput() {
            const input = document.getElementById('customTagInput');
            const name = input.value.trim();
            if (!name) return;
            pushHistory();
            if (customTagPool.indexOf(name) === -1
                && !proposals.some(p => p.tabs.some(t => t.name === name))) {
                customTagPool.push(name);
            }
            const list = workingTags[editingEventId] || tagsOf(editingEventId, WORKING_MODE);
            if (list.indexOf(name) === -1) list.push(name);
            workingTags[editingEventId] = list;
            input.value = '';
            saveWorking();
            renderTagOptions();
            renderCompareTable();
        }

        function closeTagModal() {
            document.getElementById('tagModal').classList.remove('show');
            document.body.style.overflow = '';
            editingEventId = null;
            renderCompareTable();
        }

        function clearWorking() {
            if (!confirm('確定要清除所有現場調整嗎？清除後將全部回到「多數提案採用」的預設值。（仍可按「復原上一步」救回，但建議先「備份 JSON」）')) return;
            pushHistory();
            workingTags = {};
            customTagPool = [];
            saveWorking();
            renderCompareTable();
            renderProposalMeta();
            if (currentProposal === WORKING_MODE) switchProposal(WORKING_MODE);
        }

        // ===== 匯出 =====
        // withBom：Excel／Word 需要 BOM 才能正確辨識中文；JSON 若含 BOM 會導致解析失敗
        function downloadBlob(content, filename, mime, withBom) {
            const parts = withBom === false ? [content] : ['﻿', content];
            const blob = new Blob(parts, { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            dirtySinceExport = false;   // 已把成果帶出瀏覽器
            updateSaveStatus();
        }

        function stamp() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
        }

        // 成果總表：對應大事的標籤獨立一欄
        function exportExcel() {
            let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
                + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
                + '<x:Name>大事紀總表</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
                + '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
                + '<style>td{vertical-align:top;} .h{background:#793c01;color:#fff;font-weight:bold;}</style></head><body>';
            html += '<table border="1"><tr class="h">'
                + '<td>序號</td><td>日期</td><td>大事</td><td>紀要</td>'
                + '<td>現場標籤</td>'
                + proposals.map(p => `<td>${escapeHtml(p.name)}</td>`).join('')
                + '<td>各案是否一致</td></tr>';
            tableData.forEach(item => {
                html += '<tr>'
                    + `<td>${item.id}</td>`
                    + `<td>${escapeHtml(item.column2)}</td>`
                    + `<td>${escapeHtml(item.column3)}</td>`
                    + `<td>${escapeHtml(item.column4).replace(/\n/g, '<br>')}</td>`
                    + `<td>${escapeHtml(tagsOf(item.id, WORKING_MODE).join('、'))}</td>`
                    + proposals.map(p => `<td>${escapeHtml(tagsOf(item.id, p.id).join('、'))}</td>`).join('')
                    + `<td>${hasDiff(item.id) ? '有差異' : '一致'}</td>`
                    + '</tr>';
            });
            html += '</table></body></html>';
            downloadBlob(html, `正覺大事紀_成果總表_${stamp()}.xls`, 'application/vnd.ms-excel;charset=utf-8');
        }

        // 匯出 Word：完全比照「正覺大事紀第1版-各部部長(20260626).docx」之版面
        // A4 橫向、上下 1.5cm 左右 1cm、微軟正黑體 12pt、行距固定 15pt、
        // 欄寬 1.75/3.0/8.0/15.0cm、表頭 #CAEDFB 粗體且跨頁重複、大事與紀要兩端對齊。
        const WORD_COLS = { no: 1.75, date: 3.0, event: 8.0, tag: 2.6, note: 15.0 };  // 單位 cm

        function wordStyles() {
            return '<style>'
                + '@page WordSection1 {'
                + ' size: 29.7cm 21.0cm; mso-page-orientation: landscape;'
                + ' margin: 1.5cm 1.0cm 1.5cm 1.0cm; mso-header-margin: 1.5cm; mso-footer-margin: 0cm;'

                + ' font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif; font-size: 12.0pt; }'

                + 'h2.sec-title { font-size: 14.0pt; font-weight: bold; margin: 12pt 0 6pt 0; }'

                + 'table { border-collapse: collapse; mso-table-layout-alt: fixed;'
                + ' mso-border-alt: solid windowtext .5pt; }'
                + 'td, th { border: solid windowtext .5pt; padding: 0.07cm;'
                + ' font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif; font-size: 12.0pt;'
                + ' vertical-align: top; mso-line-height-rule: exactly; line-height: 15.0pt; }'
                + 'th { background: #CAEDFB; font-weight: bold; vertical-align: middle;'
                + ' text-align: left; padding: 0.18cm; }'
                + 'td.c-no { vertical-align: middle; text-align: center; }'
                + 'td.c-just { text-align: justify; text-justify: inter-ideograph; }'
                + '</style>';
        }

        // 紀要的段落換行還原為 Word 段落
        function noteParas(text) {
            if (!text || !text.trim()) return '';
            return text.split('\n').map(line => `<p>${escapeHtml(line)}</p>`).join('');
        }

        // 大事欄套用原始超連結（來源檔紀要欄標題即為「紀要（超連結內容）」）
        function eventCellHtml(item) {
            let t = escapeHtml(item.column3);
            (item.hyperlinks || []).forEach(link => {
                if (!link.text || !link.url) return;
                const esc = escapeHtml(link.text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                t = t.replace(new RegExp(esc), `<a href="${escapeHtml(link.url)}">${escapeHtml(link.text)}</a>`);
            });
            return t;
        }

        // 欄位由左到右：序號、日期、大事、紀要、分頁籤（分頁籤欄僅總表使用）
        function wordTable(items, withTags) {
            const c = WORD_COLS;
            // 加入分頁籤欄時由紀要欄讓出寬度，總寬維持與來源檔一致
            const noteW = withTags ? (c.note - c.tag) : c.note;
            let t = `<table><thead><tr>`
                + `<th style="width:${c.no}cm">序號</th>`
                + `<th style="width:${c.date}cm">日期</th>`
                + `<th style="width:${c.event}cm">大事</th>`
                + `<th style="width:${noteW}cm">紀要（超連結內容）</th>`
                + (withTags ? `<th style="width:${c.tag}cm">分頁籤</th>` : '')
                + `</tr></thead><tbody>`;
            items.forEach(item => {
                t += '<tr>'
                    + `<td class="c-no" style="width:${c.no}cm"><p>${item.id}</p></td>`
                    + `<td style="width:${c.date}cm"><p>${escapeHtml(item.column2)}</p></td>`
                    + `<td class="c-just" style="width:${c.event}cm"><p>${eventCellHtml(item)}</p></td>`
                    + `<td class="c-just" style="width:${noteW}cm">${noteParas(item.column4)}</td>`
                    + (withTags
                        ? `<td style="width:${c.tag}cm"><p>${escapeHtml(tagsOf(item.id, WORKING_MODE).join('、'))}</p></td>`
                        : '')
                    + '</tr>';
            });
            return t + '</tbody></table>';
        }

        // 組出一份完整的 Word 檔內容
        function wordDoc(title, subtitle, items, withTags) {
            return '<html xmlns:o="urn:schemas-microsoft-com:office:office" '
                + 'xmlns:w="urn:schemas-microsoft-com:office:word" '
                + 'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">'
                + `<title>${escapeHtml(title)}</title>`
                + '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View>'
                + '<w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->'
                + wordStyles()
                + '</head><body><div class="WordSection1">'
                + `<h1 class="doc-title">${escapeHtml(title)}</h1>`
                + `<p class="desc">${escapeHtml(subtitle)}</p>`
                + wordTable(items, withTags)
                + '</div></body></html>';
        }

        // 檔名中不可出現的字元
        function safeFileName(name) {
            return String(name).replace(/[\/:*?"<>|]/g, '_').trim();
        }

        // 匯出 Word：總表一個檔，各分頁籤各自一個獨立檔案（皆依總表原始順序）
        function exportWord() {
            const names = workingTabNames();
            const total = names.length + 1;
            const msg = names.length
                ? '將依序下載 ' + total + ' 個 Word 檔：總表 1 個、分頁籤 ' + names.length + ' 個。'
                    + String.fromCharCode(10)
                    + '若瀏覽器詢問「是否允許下載多個檔案」，請按「允許」。'
                : '目前尚未有任何分頁籤，將只匯出總表 1 個檔案。';
            const nl = String.fromCharCode(10);
            if (!confirm(msg + nl + nl + '確定要開始匯出嗎？')) return;

            const when = new Date().toLocaleString('zh-TW');
            const files = [{
                name: `正覺大事紀_總表_${stamp()}.doc`,
                html: wordDoc('正覺大事紀　總表',
                    `匯出時間：${when}｜資料來源：大事紀1150630.xlsx，共 ${tableData.length} 則`,
                    tableData, true)
            }];

            names.forEach(name => {
                const items = tableData.filter(it => tagsOf(it.id, WORKING_MODE).indexOf(name) !== -1);
                files.push({
                    name: `正覺大事紀_${safeFileName(name)}_${stamp()}.doc`,
                    html: wordDoc(`正覺大事紀　${name}`,
                        `分頁籤：${name}，共 ${items.length} 則｜匯出時間：${when}`,
                        items, false)
                });
            });

            // 逐一下載，間隔一段時間避免瀏覽器忽略後續下載
            files.forEach((f, i) => {
                setTimeout(() => {
                    downloadBlob(f.html, f.name, 'application/msword;charset=utf-8');
                }, i * 500);
            });
        }

        // 備份／還原現場調整（換電腦、換瀏覽器時使用）
        function exportJson() {
            // 依序號排序的完整資料，供正式官網（Joomla）建置時直接取用：
            // 含紀要全文、超連結、分頁籤歸類，以及各案分類對照。
            const events = tableData
                .slice()
                .sort((a, b) => a.id - b.id)
                .map(item => ({
                    序號: item.id,
                    日期: item.column2,
                    大事: item.column3,
                    紀要: item.column4 || '',
                    超連結: (item.hyperlinks || []).map(h => ({ 文字: h.text, 網址: h.url })),
                    分頁籤: tagsOf(item.id, WORKING_MODE),
                    各案分類: proposals.reduce((acc, p) => {
                        acc[p.name] = tagsOf(item.id, p.id);
                        return acc;
                    }, {}),
                    現場已確認: isEdited(item.id)
                }));

            const tabs = workingTabNames().map(name => ({
                名稱: name,
                大事序號: events.filter(e => e.分頁籤.indexOf(name) !== -1).map(e => e.序號)
            }));

            // 還原用的原始結構，鍵值依序號排序以利閱讀與版本比對
            const orderedTags = {};
            Object.keys(workingTags)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(id => { orderedTags[id] = workingTags[id]; });

            const data = {
                version: 3,
                匯出時間: new Date().toISOString(),
                資料來源: '大事紀1150630.xlsx',
                說明: '「大事」與「紀要」文字不得更動；分頁籤依大事序號歸類；超連結請套用於「大事」欄中的對應文字。',
                分頁籤: tabs,
                大事: events,
                還原用: { tags: orderedTags, customPool: customTagPool.slice() }
            };

            downloadBlob(JSON.stringify(data, null, 2),
                `正覺大事紀_分頁籤成果_${stamp()}.json`, 'application/json;charset=utf-8', false);
        }

        function importJson(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    // 相容舊備份檔：去除可能存在的 BOM
                    const parsed = JSON.parse(String(reader.result).replace(/^﻿/, ''));
                    // v3 的還原資料在「還原用」之下；v1/v2 直接放在最外層
                    const restore = parsed.還原用 || parsed;
                    pushHistory();
                    workingTags = restore.tags || {};
                    customTagPool = restore.customPool || [];
                    saveWorking();
                    renderCompareTable();
                    renderProposalMeta();
                    alert('已還原現場調整。');
                } catch (err) {
                    alert('JSON 檔案格式錯誤：' + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }


        // Open Modal
        function openNoteModal(id) {

            if (item) {
                document.getElementById('modalDate').textContent = item.column2;

        function closeModal() {

        document.getElementById('noteModal').addEventListener('click', function(e) {

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof tableData === 'undefined') {
                console.error('資料未載入！');
                alert('資料載入失敗！請確認 table_data.js 檔案存在。');
                return;
            }
            if (typeof proposals === 'undefined' || typeof eventProposalCategories === 'undefined') {
                console.error('提案分類資料未載入！');
                alert('提案分類資料載入失敗！請確認 proposals_data.js 檔案存在。');
                return;
            }

            console.log('資料已載入，共 ' + tableData.length + ' 筆');
            currentProposal = proposals[0].id;
            loadWorking();
            renderProposalBar();
            showStorageWarning();
            updateSaveStatus();
            renderProposalMeta();
            renderTabs();
            categorizedData = categorizeData();
            setPublicationSubTabActive();
            updateCategoryUI();
            updateCatalogSortIndicators();

            // Event delegation for search containers
            const searchContainer = document.getElementById('searchContainer');
            const catalogSearchContainer = document.getElementById('catalogSearchContainer');

            searchContainer.addEventListener('click', e => e.stopPropagation());
            catalogSearchContainer.addEventListener('click', e => e.stopPropagation());

            document.addEventListener('click', function(e) {
                const header = document.getElementById('eventHeader');
                const catalogHeader = document.querySelector('.catalog-title-header');

                // 只在沒有搜尋關鍵字時才允許點擊外部關閉搜尋欄
                if (searchContainer.classList.contains('show') &&
                    !searchContainer.contains(e.target) &&
                    !header.contains(e.target) &&
                    !searchKeyword) {
                    closeSearch('events', false);
                }

                if (catalogSearchContainer.classList.contains('show') &&
                    catalogHeader &&
                    !catalogSearchContainer.contains(e.target) &&
                    !catalogHeader.contains(e.target) &&
                    !searchKeyword) {
                    closeSearch('catalog', false);
                }
            });
        });
    </script>
</body>
</html>
