<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正覺大事紀｜1151001 版本</title>
  <style>
    :root {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #4b392c;
      background: #faf9f6;
      --ink: #4b392c;
      --brown: #664630;
      --gold: #a88457;
      --sand: #f5f0e9;
      --line: #e7dfd5;
      --muted: #766b60;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #a57a43; outline-offset: 3px; }
    .history { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .history a { display: inline-block; padding: 9px 14px; border: 1px solid #bda989; color: var(--brown); background: #f8f5ef; text-decoration: none; font-size: 14px; white-space: nowrap; transition: background .15s, color .15s; }
    .history a:hover, .history a:focus-visible { background: var(--brown); color: white; }
    .shell { max-width: 1260px; margin: 0 auto; padding: 22px 28px 64px; }
    .header { padding: 20px 8px 22px; border-bottom: 1px solid var(--line); position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
    .header::after { content: ""; width: 76px; height: 3px; background: var(--gold); position: absolute; bottom: -2px; left: 8px; }
    .header-title-row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
    h1 { margin: 0; color: var(--brown); font-family: "Noto Serif TC", "PMingLiU", serif; font-size: clamp(29px,3vw,40px); letter-spacing: .09em; }
    .version { margin: 0; color: #967b5a; font-size: 14px; letter-spacing: .08em; }
    .panel { margin-top: 18px; background: white; border: 1px solid var(--line); box-shadow: 0 5px 24px #5843310c; overflow: hidden; }
    .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 16px; gap: 4px; }
    .tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: transparent; padding: 17px 15px 14px; color: #75695d; font-weight: 600; }
    .tab:hover, .tab:focus-visible { color: var(--brown); background: #faf7f2; }
    .tab[aria-selected="true"] { border-bottom-color: var(--gold); color: var(--brown); }
    .tab small { display: inline-block; font-weight: 400; margin-left: 6px; padding: 0 6px; background: var(--sand); color: #8b755d; font-size: 12px; }
    .controls { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 20px 24px; background: #fdfcf9; border-bottom: 1px solid var(--line); }
    .view-title { margin: 0; font-size: 20px; color: var(--brown); }
    .view-status { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .mobile-sort { display: none; border: 1px solid #b99a72; background: #fffaf1; color: var(--brown); padding: 7px 10px; font-size: 13px; }
    .search { width: min(330px,45%); padding: 10px 13px; border: 1px solid #d5c9bb; background: white; color: var(--ink); border-radius: 2px; }
    .search::placeholder { color: #978d82; }
    .focus-banner { display: none; align-items: center; gap: 10px; background: #fbf2df; border-bottom: 1px solid #e9d6b3; padding: 10px 24px; color: #715331; }
    .focus-banner.is-visible { display: flex; }
    .focus-banner button { margin-left: auto; border: 0; background: transparent; color: #79562e; text-decoration: underline; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { background: #f2ede5; color: #5e4531; text-align: left; font-size: 14px; padding: 14px 15px; border-bottom: 1px solid #e1d8c9; }
    .sort-date { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: inherit; font-weight: 700; text-align: left; }
    .sort-date:hover { color: #9a6732; }
    .sort-indicator { color: #a27c51; font-size: 13px; }
    td { padding: 16px 15px; border-bottom: 1px solid #eee9e2; vertical-align: top; line-height: 1.65; }
    tbody tr:nth-child(even) { background: #fdfcf9; }
    tbody tr:hover { background: #faf5ec; }
    .serial { width: 78px; color: #91714b; font-variant-numeric: tabular-nums; }
    .date { width: 145px; color: #77695b; font-variant-numeric: tabular-nums; }
    .author { width: 150px; }
    .event-cell, .book-cell { min-width: 300px; }
    .event-text { color: #4a3325; font-weight: 600; }
    .search-hit { background: #fff36a; color: #3c3019; text-decoration: underline; text-decoration-color: #5f481d; text-decoration-thickness: 2px; text-underline-offset: 2px; padding: 0 1px; }
    .search-snippet { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 400; overflow-wrap: anywhere; }
    .row-actions { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 10px; vertical-align: middle; }
    .mini-btn { border: 1px solid #b99a72; border-radius: 3px; padding: 2px 9px; color: #704d2d; background: #fffdf8; font-size: 13px; line-height: 1.8; text-decoration: none; white-space: nowrap; }
    .mini-btn:hover, .mini-btn:focus-visible { background: #f5e9d7; }
    .intro-btn { background: #765337; color: white; border-color: #765337; }
    .intro-btn:hover, .intro-btn:focus-visible { background: #5d3f28; color: white; }
    .external-intro::after { content: " ↗"; }
    .category-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .category-link { padding: 2px 9px; border: 1px solid #afcbd8; border-radius: 3px; background: #f3f9fc; color: #2d6888; font-size: 12px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .category-link::after { content: " ↗"; font-weight: 400; text-decoration: none; }
    .category-link:hover, .category-link:focus-visible { background: #e5f2f8; border-color: #6c9db4; color: #194d68; }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    dialog { width: min(720px,calc(100vw - 32px)); max-height: min(82vh,900px); border: 1px solid #d8cbb9; padding: 0; box-shadow: 0 24px 70px #2f211b55; }
    dialog::backdrop { background: #31251db0; }
    .modal-head { display: flex; gap: 12px; align-items: start; padding: 20px 24px; border-bottom: 2px solid #d4b98a; background: #f5f0e8; }
    .modal-head h2 { flex: 1; margin: 0; font-size: 21px; color: var(--brown); }
    .close { border: 0; background: none; font-size: 28px; line-height: 1; color: #6d5b4c; }
    .modal-content { overflow: auto; max-height: calc(82vh - 74px); padding: 20px 24px 26px; }
    .modal-context { margin: 0 0 16px; color: var(--muted); }
    .modal-note { margin: 0; white-space: pre-wrap; line-height: 1.85; }
    .more-info { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .more-info:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .more-info-heading { margin: 0 0 8px; color: var(--brown); font-size: 16px; }
    .more-info-list { margin: 0; padding-left: 25px; line-height: 2; }
    .more-info a { color: #76502e; overflow-wrap: anywhere; text-underline-offset: 3px; }
    @media(max-width:850px) {
      .shell { padding: 12px 10px 35px; }
      .header { padding: 12px 8px 18px; }
      .history { margin-left: auto; }
      .controls { flex-wrap: wrap; padding: 14px; }
      .search { width: 100%; }
      .focus-banner { padding: 10px 14px; }
    }
    @media(max-width:600px) {
      .header { align-items: flex-start; }
      .header-title-row { gap: 5px 12px; }
      h1 { font-size: 28px; }
      .version { font-size: 12px; }
      .history { width: 100%; gap: 6px; }
      .history a { padding: 7px 9px; font-size: 12px; }
      .tab { padding: 14px 12px 12px; }
      .mobile-sort { display: inline-flex; align-items: center; margin-left: auto; }
      .table-wrap { overflow-x: visible; }
      table, tbody { display: block; width: 100%; }
      thead { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      tbody tr { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
      td { display: block; min-width: 0; padding: 0; border: 0; }
      .serial { width: auto; grid-column: 1; grid-row: 1; font-weight: 700; }
      .serial::before { content: "#"; }
      .date { width: auto; grid-column: 2; grid-row: 1; }
      .date::before { content: "日期："; color: #9b8b78; }
      .event-cell, .book-cell { grid-column: 1 / -1; grid-row: 2; min-width: 0; margin-top: 4px; }
      .publication-table .date::before { content: "首版："; }
      .publication-table .author { grid-column: 1 / -1; grid-row: 3; width: auto; color: var(--muted); font-size: 13px; }
      .publication-table .author::before { content: "作者："; }
      .row-actions { margin-left: 6px; }
      .empty { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-title-row"><h1>正覺大事紀</h1><p class="version">1151001 版本</p></div>
      <nav class="history" aria-label="歷次討論版本">
        <a href="first-discussion.html">查看首次討論</a>
        <a href="second-discussion.html">查看第二次討論</a>
      </nav>
    </header>

    <main class="panel">
      <div class="tabs" id="tabs" role="tablist" aria-label="大事紀分類"></div>
      <div class="controls">
        <div><h2 class="view-title" id="viewTitle">總表</h2><p class="view-status" id="viewStatus"></p></div>
        <button class="mobile-sort" id="mobileSort" type="button">日期排序 ↕</button>
        <input class="search" id="search" type="search" aria-label="搜尋目前表格" placeholder="搜尋大事或出版品">
      </div>
      <div class="focus-banner" id="focusBanner"><span id="focusText"></span><button id="clearFocus" type="button">顯示全部</button></div>
      <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
    </main>
  </div>

  <dialog id="detailDialog" aria-labelledby="dialogTitle">
    <div class="modal-head"><h2 id="dialogTitle"></h2><button class="close" id="closeDialog" type="button" aria-label="關閉">×</button></div>
    <div class="modal-content"><p class="modal-context" id="dialogContext"></p><div id="dialogBody"></div></div>
  </dialog>

  <script src="release_1151001_data.js?v=1151001"></script>
  <script>
  (() => {
    'use strict';
    const data = window.RELEASE_1151001;
    const $ = id => document.getElementById(id);
    const events = new Map(data.events.map(item => [item.id, item]));
    const tabs = new Map(data.tabs.map(tab => [tab.name, tab.eventIds]));
    let current = '總表';
    let focusedEvent = null;
    const dateSort = { events: null, publications: null };

    function dateKey(value) {
      const parts = String(value).match(/^(\d{4})(?:[\/.\-年](\d{1,2}))?(?:[\/.\-月](\d{1,2}))?/);
      if (!parts) return Number.POSITIVE_INFINITY;
      return Number(parts[1]) * 10000 + Number(parts[2] || 0) * 100 + Number(parts[3] || 0);
    }
    function toggleDateSort() {
      const kind = current === '出版流通' ? 'publications' : 'events';
      dateSort[kind] = dateSort[kind] === 'asc' ? 'desc' : 'asc';
      render();
    }

    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    }
    function appendHighlightedText(node, value, query) {
      const source = String(value ?? '');
      if (!query) { node.textContent = source; return node; }
      const folded = source.toLocaleLowerCase();
      let cursor = 0;
      let match;
      while ((match = folded.indexOf(query, cursor)) !== -1) {
        if (match > cursor) node.append(document.createTextNode(source.slice(cursor, match)));
        node.append(element('mark', 'search-hit', source.slice(match, match + query.length)));
        cursor = match + query.length;
      }
      if (cursor < source.length) node.append(document.createTextNode(source.slice(cursor)));
      return node;
    }
    function appendNoteSnippet(content, item, query, visibleFields) {
      if (!query || visibleFields.some(value => String(value ?? '').toLocaleLowerCase().includes(query))) return;
      const note = item.note || '';
      const match = note.toLocaleLowerCase().indexOf(query);
      if (match === -1) return;
      const start = Math.max(0, match - 36);
      const end = Math.min(note.length, match + query.length + 48);
      const snippet = `${start ? '…' : ''}${note.slice(start, end)}${end < note.length ? '…' : ''}`;
      const node = element('span', 'search-snippet');
      appendHighlightedText(node, snippet, query);
      content.append(node);
    }
    function cell(row, className) {
      const td = element('td', className);
      row.append(td);
      return td;
    }
    function button(label, onClick, disabled = false) {
      const node = element('button', 'mini-btn', label);
      node.type = 'button';
      node.disabled = disabled;
      if (onClick) node.addEventListener('click', onClick);
      return node;
    }
    function showDialog(title, context, fill) {
      $('dialogTitle').textContent = title;
      $('dialogContext').textContent = context;
      $('dialogContext').hidden = !context;
      $('dialogBody').replaceChildren();
      fill($('dialogBody'));
      $('detailDialog').showModal();
    }
    function showNote(item) {
      const context = `總表序號 ${item.id}｜${item.date}｜${item.event}`;
      showDialog('紀要', context, body => body.append(appendHighlightedText(element('p', 'modal-note'), item.note, $('search').value.trim().toLocaleLowerCase())));
    }
    function hasForeignEdition(item) {
      return item.name.includes('中英文對照') || item.links.some(entry => entry.label !== '購書' && !/^(?:繁體|簡體)?中文版[（(]/.test(entry.label));
    }
    function externalLink(label, url, className = '') {
      const link = element('a', className, label);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = '出版社等書籍網站連結（在新分頁開啟）';
      return link;
    }
    function showPublicationInfo(item) {
      const title = hasForeignEdition(item) ? '出版品介紹 / About This Publication' : '出版品介紹';
      showDialog(title, '', body => {
        if (item.note) body.append(appendHighlightedText(element('p', 'modal-note'), item.note, $('search').value.trim().toLocaleLowerCase()));
        if (!item.links.length) return;
        const more = element('div', 'more-info');
        if (item.links.length === 1) {
          more.append(externalLink('更多資訊 ↗', item.links[0].url));
          body.append(more);
          return;
        }
        more.append(element('h3', 'more-info-heading', '更多資訊 / More Information'));
        const list = element('ol', 'more-info-list');
        for (const entry of item.links) {
          const li = element('li');
          li.append(externalLink(`${entry.label === '購書' ? '書籍頁面' : entry.label} ↗`, entry.url));
          list.append(li);
        }
        more.append(list);
        body.append(more);
      });
    }
    function selectTab(name, eventId = null) {
      current = name;
      focusedEvent = eventId;
      $('search').value = '';
      render();
      document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'});
    }
    function renderTabs() {
      const scroll = $('tabs').scrollLeft;
      $('tabs').replaceChildren();
      const names = ['總表', ...data.categories];
      for (const name of names) {
        const tab = element('button', 'tab');
        tab.type = 'button';
        tab.role = 'tab';
        tab.setAttribute('aria-selected', String(name === current));
        tab.append(document.createTextNode(name));
        const count = name === '總表' ? data.events.length : name === '出版流通' ? data.publications.length : tabs.get(name).length;
        tab.append(element('small', '', String(count)));
        tab.addEventListener('click', () => selectTab(name));
        $('tabs').append(tab);
      }
      $('tabs').scrollLeft = scroll;
    }
    function renderHead() {
      const publication = current === '出版流通';
      const names = publication
        ? ['序號', '出版品名稱', '第一本出版日期', '作者']
        : ['序號', '日期', '大事'];
      const row = element('tr');
      const dateIndex = publication ? 2 : 1;
      const direction = dateSort[publication ? 'publications' : 'events'];
      names.forEach((name, index) => {
        const th = element('th', index === 0 ? 'serial' : index === dateIndex ? 'date' : index === 3 ? 'author' : '');
        if (index === dateIndex) {
          th.setAttribute('aria-sort', direction === 'asc' ? 'ascending' : direction === 'desc' ? 'descending' : 'none');
          const sortButton = element('button', 'sort-date');
          sortButton.type = 'button';
          sortButton.append(document.createTextNode(name));
          sortButton.append(element('span', 'sort-indicator', direction === 'asc' ? '▲' : direction === 'desc' ? '▼' : '↕'));
          sortButton.setAttribute('aria-label', `${name}，按此${direction === 'asc' ? '由晚到早' : '由早到晚'}排序`);
          sortButton.addEventListener('click', toggleDateSort);
          th.append(sortButton);
        } else {
          th.textContent = name;
        }
        row.append(th);
      });
      $('tableHead').replaceChildren(row);
      document.querySelector('.table-wrap table').className = publication ? 'publication-table' : 'event-table';
      $('mobileSort').textContent = `${publication ? '首版日期' : '日期'}排序 ${direction === 'asc' ? '▲' : direction === 'desc' ? '▼' : '↕'}`;
      $('mobileSort').setAttribute('aria-label', `按${publication ? '首版日期' : '日期'}${direction === 'asc' ? '由晚到早' : '由早到晚'}排序`);
    }
    function matches(item, query, publication) {
      if (!query) return true;
      const text = publication
        ? [item.id, item.name, item.author, item.date, item.note].join(' ')
        : [item.id, item.date, item.event, item.note].join(' ');
      return text.toLocaleLowerCase().includes(query);
    }
    function renderEvent(item, query) {
      const row = element('tr');
      row.dataset.eventId = item.id;
      appendHighlightedText(cell(row, 'serial'), item.id, query);
      appendHighlightedText(cell(row, 'date'), item.date, query);
      const content = cell(row, 'event-cell');
      content.append(appendHighlightedText(element('span', 'event-text'), item.event, query));
      if (item.note) {
        const actions = element('span', 'row-actions');
        actions.append(button('紀要', () => showNote(item)));
        content.append(actions);
      }
      appendNoteSnippet(content, item, query, [item.id, item.date, item.event]);
      if (current === '總表' && item.categories.length) {
        const links = element('div', 'category-links');
        item.categories.forEach(name => {
          const link = element('button', 'category-link', name);
          link.type = 'button';
          link.setAttribute('aria-label', `前往${name}分頁，總表序號${item.id}`);
          link.addEventListener('click', () => selectTab(name, item.id));
          links.append(link);
        });
        content.append(links);
      }
      return row;
    }
    function renderPublication(item, query) {
      const row = element('tr');
      row.dataset.publicationId = item.id;
      appendHighlightedText(cell(row, 'serial'), item.id, query);
      const content = cell(row, 'book-cell');
      content.append(appendHighlightedText(element('span', 'event-text'), item.name, query));
      if (item.note || item.links.length) {
        const actions = element('span', 'row-actions');
        const label = hasForeignEdition(item) ? '介紹 / About' : '介紹';
        if (!item.note && item.links.length === 1) {
          const link = externalLink(label, item.links[0].url, 'mini-btn intro-btn external-intro');
          link.setAttribute('aria-label', `${label}，在新分頁開啟`);
          actions.append(link);
        } else {
          const intro = button(label, () => showPublicationInfo(item));
          intro.classList.add('intro-btn');
          actions.append(intro);
        }
        content.append(actions);
      }
      appendNoteSnippet(content, item, query, [item.id, item.name, item.date, item.author]);
      row.append(content);
      appendHighlightedText(cell(row, 'date'), item.date, query);
      appendHighlightedText(cell(row, 'author'), item.author, query);
      return row;
    }
    function render() {
      renderTabs();
      renderHead();
      $('viewTitle').textContent = current;
      const query = $('search').value.trim().toLocaleLowerCase();
      let rows;
      if (current === '出版流通') {
        rows = data.publications.filter(item => (focusedEvent === null || item.eventIds.includes(focusedEvent)) && matches(item, query, true));
      } else {
        const ids = current === '總表' ? data.events.map(item => item.id) : tabs.get(current);
        rows = ids.map(id => events.get(id)).filter(item => (focusedEvent === null || item.id === focusedEvent) && matches(item, query, false));
      }
      const direction = dateSort[current === '出版流通' ? 'publications' : 'events'];
      if (direction) {
        rows = rows.map((item, index) => ({ item, index }))
          .sort((a, b) => (dateKey(a.item.date) - dateKey(b.item.date)) * (direction === 'asc' ? 1 : -1) || a.index - b.index)
          .map(entry => entry.item);
      }
      const banner = $('focusBanner');
      banner.classList.toggle('is-visible', focusedEvent !== null);
      if (focusedEvent !== null) {
        $('focusText').textContent = rows.length
          ? `總表序號 ${focusedEvent} 在「${current}」中的對應項目`
          : `總表序號 ${focusedEvent} 已歸入「${current}」，但尚無可對應的出版品項目。`;
      }
      const total = current === '出版流通' ? data.publications.length : current === '總表' ? data.events.length : tabs.get(current).length;
      $('viewStatus').textContent = `顯示 ${rows.length} 筆／共 ${total} 筆`;
      const body = $('tableBody');
      body.replaceChildren();
      if (!rows.length) {
        const row = element('tr');
        const empty = cell(row, 'empty');
        empty.colSpan = current === '出版流通' ? 4 : 3;
        empty.textContent = focusedEvent !== null ? '此則尚無對應項目' : '沒有符合的資料';
        body.append(row);
      } else {
        rows.forEach(item => body.append(current === '出版流通' ? renderPublication(item, query) : renderEvent(item, query)));
      }
    }
    $('search').addEventListener('input', render);
    $('mobileSort').addEventListener('click', toggleDateSort);
    $('clearFocus').addEventListener('click', () => { focusedEvent = null; render(); });
    $('closeDialog').addEventListener('click', () => $('detailDialog').close());
    $('detailDialog').addEventListener('click', event => { if (event.target === $('detailDialog')) $('detailDialog').close(); });
    render();
  })();
  </script>
</body>
</html>
